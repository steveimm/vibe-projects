<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}} 'nonce-{{nonce}}'; font-src {{cspSource}}; connect-src {{cspSource}}; worker-src blob:;">
    <link rel="stylesheet" href="{{editorStyle}}">
    <link rel="stylesheet" href="{{style}}">
    <title>Record Explorer</title>
</head>
<body>
    <header class="toolbar">
        <div class="file-heading"><span class="file-icon" aria-hidden="true">{ }</span><strong id="file-name">Record Explorer</strong></div>
        <div class="tools">
            <button id="previous" title="Previous row (Alt+Up)" aria-label="Previous row" disabled>↑</button>
            <button id="next" title="Next row (Alt+Down)" aria-label="Next row" disabled>↓</button>
            <form id="jump-form"><label for="jump">Row</label><input id="jump" type="number" min="1" step="1" value="1" aria-label="Go to row" disabled><span id="total">/ 0</span></form>
            <span class="tool-divider"></span>
            <button id="word-wrap" title="Toggle word wrap" aria-pressed="false">Word wrap</button>
            <button id="copy" disabled>Copy JSON</button>
            <button id="open-text" title="Open the original file in the text editor">Open text</button>
            <button id="refresh" title="Reload the file">Refresh</button>
        </div>
    </header>
    <main class="workspace">
        <section class="detail" aria-label="Selected JSON row">
            <header class="pane-heading"><span id="row-heading">SELECT A ROW</span><div class="detail-tools"><button id="fold-all" title="Collapse all objects and arrays" disabled>Collapse all</button><button id="unfold-all" title="Expand all objects and arrays" disabled>Expand all</button><span id="row-info"></span></div></header>
            <div id="notice" role="status" hidden></div>
            <div id="code-view" aria-busy="true" data-editor-worker="{{editorWorker}}" data-json-worker="{{jsonWorker}}"></div>
            <div id="empty-state"><span class="empty-icon" aria-hidden="true">{ }</span><strong>Opening file</strong><span>Records will appear as the file is loaded.</span></div>
            <div id="preview-divider" role="separator" tabindex="0" aria-orientation="horizontal" aria-label="Resize text preview" hidden></div>
            <section id="text-preview" aria-labelledby="preview-title preview-path" hidden>
                <header class="preview-heading"><div class="preview-label"><span id="preview-title">TEXT PREVIEW</span><code id="preview-path"></code></div><div class="preview-tools"><button id="preview-copy" disabled>Copy text</button><button id="preview-wrap" aria-pressed="true">Word wrap</button><button id="preview-close" aria-label="Close text preview">Close</button></div></header>
                <div class="preview-body"><div id="preview-editor" hidden></div><div id="preview-status" role="status"></div></div>
            </section>
        </section>
        <div id="divider" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize row list" aria-valuemin="220" aria-valuemax="620" aria-valuenow="320"></div>
        <aside class="rows-pane" aria-label="File rows">
            <header class="pane-heading"><span>ROWS</span><span id="row-count">0</span></header>
            <div class="list-hint">Select a row to view its JSON</div>
            <div id="row-list" class="viewport" role="listbox" tabindex="0" aria-label="JSONL rows" aria-busy="true">
                <div id="row-spacer" class="spacer"><div id="row-canvas" class="canvas"></div></div>
            </div>
        </aside>
    </main>
    <footer><span id="status">Indexing file…</span><span id="footer-hint">Read only · Hover strings for text preview</span></footer>
    <script nonce="{{nonce}}" src="{{script}}"></script>
</body>
</html>
